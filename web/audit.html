<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>审计 · OA阅答 v1.0.1</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail">
        <a class="brand" href="./" aria-label="OA阅答 首页"><img class="brand-logo" src="./assets/oa-yueda-logo-v1.png" alt="OA阅答" /><span>OA阅答<small>v1.0.1</small></span></a>
        <nav aria-label="主导航">
          <a class="nav-item" href="./">工作台</a>
          <a class="nav-item" href="./cases.html">案件</a>
          <a class="nav-item active" href="./audit.html">审计</a>
          <a class="nav-item" href="./#settings">设置</a>
        </nav>
        <div class="rail-footer"><span class="status-dot ready"></span>本地审计 <strong>NotebookLM 用量</strong><small>只记录本软件在本机发起的操作</small></div>
      </aside>
      <main class="audit-page">
        <header class="topbar">
          <div><p class="eyebrow">本机审计 / NotebookLM 用量</p><h1>NotebookLM 用量审计</h1><p class="cases-intro">选择你的套餐类型，以分数形式查看今日对话、账户笔记本与当前 OA Notebook 来源的剩余额度。</p></div>
          <button class="ghost" id="refreshAudit">同步笔记本数</button>
        </header>
        <section class="audit-notice"><b>统计口径</b><p>“今日对话”只统计 OA阅答在本机发起的 NotebookLM 查询；“笔记本数”会尝试从已登录账户同步，失败时会明确标记为“本机已知”。配额以所选套餐为参考，实际限制以 Google 当前页面为准。</p></section>
        <section class="audit-plan-panel">
          <label for="auditPlan"><b>NotebookLM 套餐类型</b><span>用于计算剩余额度，不会校验或改变你的 Google 订阅。</span></label>
          <select id="auditPlan"><option value="free">免费 / Standard</option><option value="pro">Pro</option></select>
        </section>
        <section id="auditCards" class="audit-cards" aria-live="polite"></section>
        <section class="audit-detail"><h2>同步状态</h2><p id="auditSyncState">正在读取本机审计记录…</p></section>
      </main>
    </div>
    <script src="./audit.js"></script>
  </body>
</html>
